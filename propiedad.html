<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3efe6">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/cormorant-garamond-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="propiedad.css">
  <title>Inmueble — Nidus</title>
</head>
<body data-pagina="propiedad" data-cab="cab-fija">
  <div data-nidus="cabecera"></div>
  <main id="contenido" class="ficha"></main>
  <div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Galería" hidden>
    <button type="button" class="visor-cerrar" data-v="cerrar">Cerrar</button>
    <button type="button" class="redondo visor-prev" data-v="-1" aria-label="Anterior">‹</button>
    <img id="visor-img" alt="">
    <button type="button" class="redondo visor-next" data-v="1" aria-label="Siguiente">›</button>
    <p class="visor-cuenta" id="visor-cuenta"></p>
  </div>
  <div data-nidus="pie"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="datos.js"></script>
  <script src="app.js"></script>
  <script src="propiedad.js"></script>
</body>
</html>
